<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Le chemin d'un log : collecter, normaliser, enrichir, stocker (data engineering), puis détecter (SOC)"><title>Le chemin d'un log : collecter, normaliser, enrichir, stocker (data engineering), puis détecter (SOC)</title><style>@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:JBM;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}.m{font-family:JBM,ui-monospace,Menlo,Consolas,monospace}.s{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif}.tx{fill:#d3dae3}.t2{fill:#8a96a6}.t3{fill:#7d8898}.ac{fill:#3ee08f}.nw{fill:#4cc2ff}.dv{fill:#f2b84b}.sc{fill:#ff8a7a}.da{fill:#3ee08f}</style><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="1200" height="300" fill="#0a0d12"/><rect width="1200" height="300" fill="url(#g)"/><path d="M228 160.0H956" stroke="#2a3442" stroke-width="1.5" stroke-dasharray="4 5"/><circle r="3" fill="#4cc2ff"><animateMotion dur="6s" begin="-0s" repeatCount="indefinite" path="M228 160.0H956"/></circle><circle r="3" fill="#4cc2ff"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M228 160.0H956"/></circle><circle r="3" fill="#4cc2ff"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M228 160.0H956"/></circle><rect x="28" y="96" width="200" height="128" rx="10" fill="#121821" stroke="#1e2632"/><rect x="28" y="96" width="200" height="3" rx="1.5" fill="#3ee08f"/><text x="46" y="130" class="m da" font-size="13">1.</text><text x="68" y="130" class="m tx" font-size="16" font-weight="600">collecter</text><text x="46" y="160" class="s t2" font-size="13.5">les logs de centaines</text><text x="46" y="180" class="s t2" font-size="13.5">d'équipements, chacun</text><text x="46" y="200" class="s t2" font-size="13.5">avec son format</text><rect x="260" y="96" width="200" height="128" rx="10" fill="#121821" stroke="#1e2632"/><rect x="260" y="96" width="200" height="3" rx="1.5" fill="#3ee08f"/><text x="278" y="130" class="m da" font-size="13">2.</text><text x="300" y="130" class="m tx" font-size="16" font-weight="600">normaliser</text><text x="278" y="160" class="s t2" font-size="13.5">l'heure, l'IP source,</text><text x="278" y="180" class="s t2" font-size="13.5">l'utilisateur</text><rect x="492" y="96" width="200" height="128" rx="10" fill="#121821" stroke="#1e2632"/><rect x="492" y="96" width="200" height="3" rx="1.5" fill="#3ee08f"/><text x="510" y="130" class="m da" font-size="13">3.</text><text x="532" y="130" class="m tx" font-size="16" font-weight="600">enrichir</text><text x="510" y="160" class="s t2" font-size="13.5">à quel poste correspond</text><text x="510" y="180" class="s t2" font-size="13.5">cette IP ?</text><rect x="724" y="96" width="200" height="128" rx="10" fill="#121821" stroke="#1e2632"/><rect x="724" y="96" width="200" height="3" rx="1.5" fill="#3ee08f"/><text x="742" y="130" class="m da" font-size="13">4.</text><text x="764" y="130" class="m tx" font-size="16" font-weight="600">stocker</text><text x="742" y="160" class="s t2" font-size="13.5">de gros volumes, qu'on</text><text x="742" y="180" class="s t2" font-size="13.5">peut interroger vite</text><rect x="956" y="96" width="200" height="128" rx="10" fill="#121821" stroke="#1e2632"/><rect x="956" y="96" width="200" height="3" rx="1.5" fill="#ff8a7a"/><text x="974" y="130" class="m sc" font-size="13">5.</text><text x="996" y="130" class="m tx" font-size="16" font-weight="600">détecter</text><text x="974" y="160" class="s t2" font-size="13.5">ce qui est anormal,</text><text x="974" y="180" class="s t2" font-size="13.5">avec des règles</text><path d="M28 72V64H924V72" fill="none" stroke="#3ee08f" stroke-opacity="0.7"/><text x="476.0" y="56" class="m da" font-size="13" text-anchor="middle">data engineering</text><path d="M956 72V64H1156V72" fill="none" stroke="#ff8a7a" stroke-opacity="0.7"/><text x="1056.0" y="56" class="m sc" font-size="13" text-anchor="middle">SOC</text><text x="28" y="30" class="m t3" font-size="13"># le chemin d'un log, de l'équipement jusqu'à l'alerte</text><text x="28" y="262" class="s t2" font-size="15">Si les quatre premières étapes sont mal faites, la cinquième ne voit rien.</text></svg>
